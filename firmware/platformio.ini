[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<main.cpp> -<mesh_now.cpp>
lib_deps =
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
    bblanchon/ArduinoJson@7.4.2
    sparck75/AlteriomPainlessMesh@^2.0.0
build_flags = -Wall -Wextra -DTHERMOSAFE_MESH_GATEWAY=1

[env:esp32dev-gateway]
extends = env:esp32dev

[env:esp32dev-worker]
extends = env:esp32dev
build_flags = -Wall -Wextra -DTHERMOSAFE_MESH_GATEWAY=0 -DDHT_DEBUG

[env:esp32dev-espnow]
extends = env:esp32dev
build_src_filter = +<mesh_now.cpp> -<main.cpp>
lib_deps =
