<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beacon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; }
/* Layout: Nick's laptop layout. Risk list on the left, explorable map on the right. Tap a worker for readings; Locate pulls up the route diagram. */
:root {
  color-scheme: light;
  --bg: #F3F4F1; --panel: #FFFFFF; --ink: #14171A; --ink-2: #4A5258; --ink-3: #6A7178;
  --line: #DADDD6; --line-2: #ECEEE9; --edge: #8A9088; --hover: #EEF1EB;
  --ok: #3DBE6C; --ok-ink: #0E1F16; --ok-card: #E2F4E8; --ok-line: #A8DABB;
  --watch: #F5C518; --watch-ink: #1B1A12; --watch-card: #FEF5D2; --watch-line: #EBD88C;
  --danger: #D7372B; --danger-ink: #FFFFFF; --danger-card: #FBE3E0; --danger-line: #EBB3AC;
  --gray: #A3A99F; --gray-ink: #14171A; --gray-card: #EEF0EC; --gray-line: #CDD1CA;
  --cold: #5B8DEF; --alert-btn: #C42F24; --you: #2563EB; --map: #E8ECE3; --white: #FFFFFF;
  --plate: rgba(255, 255, 255, 0.62); --plate-on: rgba(255, 255, 255, 0.97); --plate-line: #B5BDB2;
  --display: "Space Grotesk", Inter, system-ui, sans-serif;
  --font: Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --move: 0.8s;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

.app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.hdr {
  flex: none; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) 8px max(20px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 30;
}
.hdr h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; font-size: 13px; color: var(--ink-2); }
.legend > span { display: flex; align-items: center; gap: 8px; }
.dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.dot svg { width: 12px; height: 12px; fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.demo-btn { height: 34px; padding: 0 12px; border: 1px dashed var(--edge); border-radius: 8px; background: var(--panel); font-weight: 600; font-size: 13px; color: var(--ink-2); }
.demo-pop {
  position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); top: calc(100% + 6px); width: 250px; z-index: 60;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(20, 23, 26, .2);
  padding: 12px; display: grid; gap: 8px;
}
.demo-pop button.d { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; font-weight: 600; font-size: 14px; }
.demo-pop button.d:hover { background: var(--hover); }
.speed { display: flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 13px; }
.speed button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 9px; font-weight: 600; font-size: 13px; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--white); border-color: var(--ink); }

.main { flex: 1 1 0; min-height: 0; display: flex; flex-wrap: wrap; overflow: auto; background: var(--ink-2); }

/* ---------- worker list ---------- */
.rail { flex: 1 1 360px; max-width: 420px; min-width: 0; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
.rail.min { flex: 0 0 76px; }
.rail-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 20px; }
.rail-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 15px; }
.rail-head span { font-size: 13px; color: var(--ink-2); }
.ctl { height: 44px; padding: 0 14px; border: 1px solid var(--edge); border-radius: 8px; background: var(--panel); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.ctl:hover { background: var(--hover); }
.counts { flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 2px 12px 14px; }
.counts > div { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 8px; background: var(--bg); }
.counts b { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1; }
.counts b i { width: 12px; height: 12px; border-radius: 50%; }
.counts small { font-size: 12px; color: var(--ink-2); }
.list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
.wcard {
  width: 100%; padding: 12px; border: 0; border-radius: 10px; display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--card); box-shadow: inset 0 0 0 1px var(--cline);
}
.wcard * { pointer-events: none; }
.wcard:hover { filter: brightness(0.97); }
.wcard.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.av { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--fill); color: var(--ink2); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px; }
.wcard .who { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.wcard .nm { font-weight: 600; font-size: 15px; }
.wcard .st { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.wcard .st svg { width: 13px; height: 13px; stroke: var(--ink); stroke-width: 3.2; }
.wcard .vals { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-variant-numeric: tabular-nums; }
.wcard .vals b { font-weight: 600; font-size: 16px; }
.wcard .vals span { font-size: 13px; color: var(--ink-2); }
.chips { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; overflow-y: auto; }
.chips .av { border: 0; padding: 0; }
.chips .av.sel { box-shadow: 0 0 0 2px var(--white), 0 0 0 4px var(--ink); }

/* ---------- map ---------- */
.mapv { position: relative; flex: 999 1 560px; min-width: 0; min-height: 360px; overflow: hidden; background: var(--map); cursor: grab; touch-action: none; user-select: none; }
.mapv.drag { cursor: grabbing; }
.world { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; transition: transform 450ms cubic-bezier(.2, .7, .2, 1); }
.mapv.drag .world, .mapv.drag .pin { transition: none !important; }
.world > svg { position: absolute; left: 0; top: 0; display: block; }
.pin {
  position: absolute; width: 44px; height: 44px; padding: 0; border: 3px solid var(--white); border-radius: 50%;
  background: var(--fill); color: var(--ink2); font-family: var(--display); font-weight: 700; font-size: 14px;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(20, 23, 26, .35);
  transition: transform 450ms cubic-bezier(.2, .7, .2, 1), left var(--move) linear, top var(--move) linear;
}
.pin.sel { box-shadow: 0 0 0 3px var(--ink); }
.pin.you { background: var(--white); color: var(--ink); border: 2px solid var(--ink); font-size: 12px; cursor: default; }
.pin .ini { position: relative; }
.pin .pulse { position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--danger); pointer-events: none; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(2.2); opacity: 0; } }
.pin .fl { position: absolute; top: -8px; right: -10px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; background: var(--ink); color: var(--white); font-size: 11px; line-height: 20px; border: 2px solid var(--white); }
.pin .tag { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 4px 10px; border-radius: 6px; background: var(--ink); color: var(--white); font-family: var(--font); font-weight: 600; font-size: 13px; pointer-events: none; }
.zoom { position: absolute; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
.zoom button { width: 44px; height: 44px; padding: 0; border: 1px solid var(--edge); border-radius: 8px; background: var(--panel); display: grid; place-items: center; box-shadow: 0 1px 2px rgba(20, 23, 26, .12); }
.zoom button:hover { background: var(--hover); }
.banner {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); z-index: 6;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 6px 6px 14px; border-radius: 12px;
  background: var(--ink); color: var(--white); box-shadow: 0 8px 24px rgba(20, 23, 26, .25); cursor: default;
}
.banner .nm { font-weight: 600; font-size: 15px; white-space: nowrap; }
.banner .v { font-size: 14px; color: #D5D9D2; white-space: nowrap; font-variant-numeric: tabular-nums; }
.btn { height: 44px; padding: 0 16px; border: 0; border-radius: 8px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn.light { background: var(--white); color: var(--ink); }
.btn.dark { background: var(--ink); color: var(--white); }
.btn.red { background: var(--alert-btn); color: var(--white); }
.btn.sent { background: var(--white); color: var(--ink); border: 1px solid var(--edge); }
.banner .btn.sent { background: var(--ink); color: var(--white); border-color: var(--edge); }
.btn.green { background: var(--ok); color: var(--ok-ink); cursor: default; }
.x { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: var(--panel); display: grid; place-items: center; }
.x:hover { background: var(--hover); }

/* readings pop-up */
.pop {
  position: absolute; left: 16px; right: 84px; bottom: 16px; z-index: 7; padding: 12px 12px 14px 16px; border-radius: 12px;
  background: var(--panel); box-shadow: 0 10px 30px rgba(20, 23, 26, .22); cursor: default; display: flex; flex-direction: column; gap: 6px;
  animation: rise 260ms cubic-bezier(.2, .7, .2, 1);
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.pop-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pop-head .av { width: 36px; height: 36px; font-size: 13px; }
.pop-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 17px; }
.pill { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--cline); font-size: 13px; font-weight: 600; }
.pill svg { width: 12px; height: 12px; stroke: var(--ink); stroke-width: 3.4; }
.where { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); }
.where svg { width: 14px; height: 14px; stroke-width: 2.2; }
.grow { flex: 1 1 auto; }
.vrow { display: grid; grid-template-columns: 110px 120px minmax(0, 1fr) 110px; gap: 16px; align-items: center; padding: 10px 0 6px; border-top: 1px solid var(--line-2); }
.vrow .lbl { font-weight: 600; font-size: 14px; }
.vrow .now { font-family: var(--display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.vrow .now small { display: block; font-family: var(--font); font-weight: 500; font-size: 12px; color: var(--ink-3); }
.bar { position: relative; height: 14px; }
.bar .bands { position: absolute; inset: 0; display: flex; gap: 2px; border-radius: 7px; overflow: hidden; }
.bar .mark { position: absolute; top: -6px; bottom: -6px; width: 4px; transform: translateX(-50%); border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--white); transition: left .4s ease; }
.bnames { display: flex; gap: 2px; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.bnames span { min-width: 0; overflow: hidden; white-space: nowrap; text-align: center; }
.lvl { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.lvl i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.buzzline { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); padding-top: 4px; }

/* locate: the route diagram pulls up over the map */
.locate {
  position: absolute; inset: 12px; z-index: 8; background: var(--panel); border-radius: 14px; box-shadow: 0 14px 40px rgba(20, 23, 26, .28);
  display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); overflow: hidden; cursor: default;
  animation: pull 320ms cubic-bezier(.2, .7, .2, 1);
}
@keyframes pull { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.loc-info { display: flex; flex-direction: column; gap: 18px; padding: 16px; min-width: 0; }
.loc-head { display: flex; align-items: center; gap: 12px; }
.loc-head h2 { margin: 0; flex: 1; min-width: 0; font-family: var(--display); font-weight: 600; font-size: 18px; }
.dir { display: flex; flex-direction: column; gap: 10px; }
.arrow-wrap { width: 96px; height: 96px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; }
.arrow { width: 58px; height: 58px; transition: transform .4s ease; color: var(--you); }
.arrow.here { color: var(--ok); }
.dir .big { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; }
.dir .then { font-size: 16px; color: var(--ink-2); }
.loc-info .btn { width: 100%; margin-top: auto; height: 48px; font-size: 15px; }
.loc-view { position: relative; min-height: 0; background: var(--map); perspective: 1200px; overflow: hidden; }

/* the building in 3D */
.scene { position: absolute; left: 50%; top: 56%; width: 0; height: 0; transform-style: preserve-3d; transform: rotateX(55deg) rotateZ(-28deg) scale(1); transition: transform 1s cubic-bezier(.2, .7, .2, 1); }
.scene.flat { transform: rotateX(0deg) rotateZ(-28deg) scale(0.5); }
.ground { position: absolute; transform: translateZ(-2px); }
.ground img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.floor { position: absolute; transform-style: preserve-3d; border: 1.5px solid var(--plate-line); background: var(--plate); border-radius: 4px; box-shadow: 0 8px 22px rgba(20, 23, 26, .10); transition: transform 1s cubic-bezier(.2, .7, .2, 1), background .3s; }
.scene.flat .floor { transform: translateZ(0) !important; }
.floor.on { background: var(--plate-on); border: 2.5px solid var(--c); }
.floor.mine:not(.on) { border-color: var(--you); }
.ring { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid var(--c); animation: ping 1.6s ease-out infinite; transition: left var(--move) linear, top var(--move) linear; }
.ring.you { animation: none; opacity: .6; }
@keyframes ping { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
.overlay { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; }
.overlay.shown { opacity: 1; }
.floor-num { position: absolute; transform: translate(-130%, -50%); width: 26px; height: 26px; border-radius: 7px; font-size: 13px; font-weight: 700; text-align: center; line-height: 24px; background: var(--white); color: var(--ink-2); border: 1px solid var(--plate-line); }
.floor-num.on { background: var(--c); color: var(--c-ink, var(--white)); border-color: var(--c); }
.marker { position: absolute; width: 40px; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; transition: left var(--move) linear, top var(--move) linear; }
.marker:not(.you) { z-index: 2; }
.marker .head { width: 40px; height: 40px; border-radius: 50%; background: var(--c); color: var(--c-ink, var(--white)); font-family: var(--display); font-size: 13px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--white), 0 4px 12px rgba(20, 23, 26, .25); }
.marker.you .head { background: var(--white); color: var(--ink); box-shadow: 0 0 0 2px var(--ink), 0 4px 12px rgba(20, 23, 26, .2); font-size: 11px; }
.marker .stem { width: 3px; height: 12px; background: var(--c); }
.marker.you .stem { background: var(--ink); }
.flatmap img { position: absolute; display: block; max-width: none; transition: left var(--move) linear, top var(--move) linear; }
.flatmap svg.route { position: absolute; inset: 0; width: 100%; height: 100%; }

@media (max-width: 760px) {
  .main { flex-direction: column; flex-wrap: nowrap; }
  .mapv { order: -1; flex: 0 0 auto; height: 540px; }
  .rail { flex: 1 0 auto; max-width: none; border-right: 0; overflow: visible; }
  .rail.min { flex: 1 0 auto; }
  .list { overflow: visible; }
  .pop { right: 16px; bottom: 76px; max-height: calc(100% - 92px); overflow-y: auto; }
  .zoom { flex-direction: row; right: auto; left: 16px; bottom: 16px; }
  .vrow { grid-template-columns: 1fr auto; gap: 6px 12px; }
  .vrow .rng { grid-column: 1 / -1; grid-row: 2; }
  .vrow .lvl { justify-content: flex-end; }
  .locate {
    position: fixed; inset: 0; border-radius: 0; z-index: 50; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .loc-info { gap: 12px; }
  .dir { flex-direction: row; align-items: center; gap: 16px; }
  .dir .big { font-size: 38px; }
  .loc-view { margin: 0 12px 12px; border-radius: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .world, .pin, .scene, .floor, .ring, .marker, .arrow, .overlay, .flatmap img, .bar .mark { transition: none !important; }
  .pin .pulse, .ring { animation: none; opacity: 0; }
  .pop, .locate { animation: none; }
}
</style>
</head>
<body>

<div class="app">
  <header class="hdr">
    <h1>Beacon</h1>
    <div class="legend">
      <span><span class="dot" style="background:var(--ok)"><svg viewBox="0 0 24 24" aria-hidden="true" style="stroke:var(--ok-ink)"><path d="M20 6L9 17l-5-5"/></svg></span>Okay</span>
      <span><span class="dot" style="background:var(--watch)"><svg viewBox="0 0 24 24" aria-hidden="true" style="stroke:var(--watch-ink)"><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg></span>Questionable</span>
      <span><span class="dot" style="background:var(--danger)"><svg viewBox="0 0 24 24" aria-hidden="true" style="stroke:var(--white)"><path d="M18 6L6 18M6 6l12 12"/></svg></span>In danger</span>
      <button class="demo-btn" id="demo-btn" aria-expanded="false" aria-controls="demo-pop">Demo</button>
    </div>
    <div class="demo-pop" id="demo-pop" hidden>
      <button class="d" id="d-rose" data-demo="rose_heart">Rose's heart races</button>
      <button class="d" id="d-joe" data-demo="joe_hot">Joe's room gets hot</button>
      <button class="d" id="d-mae" data-demo="mae_cold">Mae gets cold outside</button>
      <button class="d" id="d-walk" data-demo="walk">Walk me there</button>
      <button class="d" id="d-reset" data-demo="reset">Reset</button>
      <div class="speed" role="group" aria-label="Speed">Speed
        <button id="sp-1" data-speed="1" aria-pressed="true">1×</button>
        <button id="sp-5" data-speed="5" aria-pressed="false">5×</button>
        <button id="sp-20" data-speed="20" aria-pressed="false">20×</button>
      </div>
    </div>
  </header>
  <div class="main">
    <aside class="rail" id="rail" aria-label="Workers"></aside>
    <div class="mapv" id="mapv">
      <div class="world" id="world"></div>
      <div class="banner" id="banner" data-nodrag role="status" hidden>
        <span class="dot" style="width:24px;height:24px;background:var(--danger)"><svg viewBox="0 0 24 24" aria-hidden="true" style="stroke:var(--white);width:14px;height:14px"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
        <span class="nm" id="bn-nm"></span><span class="v" id="bn-v"></span>
        <button class="btn light" id="bn-show">Show</button>
        <button class="btn red" id="bn-alert"></button>
      </div>
      <div class="zoom" data-nodrag>
        <button id="z-in" aria-label="Zoom in"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="z-out" aria-label="Zoom out"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button id="z-fit" aria-label="Show everyone"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
      <section class="pop" id="pop" data-nodrag hidden></section>
      <section class="locate" id="locate" data-nodrag hidden></section>
    </div>
  </div>
</div>

<script>
"use strict";

/* ================= the site ================= */
// metres, in the building's frame: the ILC runs x 0..90, y 0..50, north is +y
const BUILDING = {

  const ab = bands(["Too cold", "Normal", "Warm", "Too hot"], ["var(--cold)", "var(--ok)", "var(--watch)", "var(--danger)"], [A - 40, A - 2.5 * T, A + 2.5 * T, A + 2.5 * T + 10, A + 40]);
  setHtml($("pp-rows"),
    (p.hr != null ? vitalRow("Heart rate", `${p.hr} BPM`, `usual ${p.hrUsual}`, p.hr, hb, E - 45, E + 70, p.hrState, ["Too low", "Normal", "Elevated", "Too high"]) : "") +
    (p.air != null ? vitalRow("Air temp", `${p.air}°F`, `usual here ${Math.round(A)}°`, p.air, ab, A - 40, A + 40, p.airState, ["Too cold", "Normal", "Warm", "Too hot"]) : ""));
  const bz = p.buzz ? `${ICON.buzz}<span>${{ rest: "Clip told them to rest", cool: "Clip told them to cool off", warm: "Clip told them to warm up" }[p.buzz.why]}, ${ago(state.t - p.buzz.t)}</span>` : "";
  setHtml($("pp-buzz"), bz); $("pp-buzz").hidden = !bz;
}

/* ---------- locate: the route diagram ---------- */
function openLocate() { if (!sel) return; locating = true; locDom = null; $("locate").hidden = false; renderAll(); }
function closeLocate() { locating = false; locDom = null; $("locate").hidden = true; $("locate").innerHTML = ""; renderAll(); }

function route(p, m) {
  if (!m || m.x === null || p.x === null) return { plain: true, big: p.place, then: "" };
  const together = (p.outdoor && m.outdoor) || (!p.outdoor && !m.outdoor && p.floor === m.floor);
  const peer = m.peers[p.id];
  if (together && peer !== undefined && peer < 4) return { here: true, big: "Here", then: `${p.first} is ${Math.max(1, Math.round(peer))} m away` };
  let to = { x: p.x, y: p.y }, then;
  if (p.outdoor && !m.outdoor) {
    if (m.floor > 1) { to = nearest(BUILDING.stairs, m.x, m.y); then = "Stairs down, then outside"; }
    else { to = nearest(BUILDING.doors, p.x, p.y); then = cap(to.name) + ", then outside"; }
  } else if (!p.outdoor && m.outdoor) {
    to = nearest(BUILDING.doors, m.x, m.y); then = cap(to.name) + (p.floor > 1 ? `, then floor ${p.floor}` : "");
  } else if (!p.outdoor && p.floor !== m.floor) {
    to = nearest(BUILDING.stairs, m.x, m.y); const n = p.floor - m.floor;
    then = `${cap(to.name)}, then ${Math.abs(n)} floor${Math.abs(n) > 1 ? "s" : ""} ${n > 0 ? "up" : "down"}`;
  } else then = cap(p.outdoor ? "outside" : p.place.replace(/^Floor \d+,?\s*/, "") || "on your floor");
  const d = together && peer !== undefined && peer < 10 ? peer : Math.hypot(to.x - m.x, to.y - m.y);
  return { big: `${Math.max(1, Math.round(d))} m`, then, dx: to.x - m.x, dy: to.y - m.y };
}

function renderLocate() {
  const box = $("locate"), p = person(sel);
  if (!p) return closeLocate();
  const m = me(), mode = p.outdoor ? "out" : "in";
  if (!locDom || locDom.mode !== mode || locDom.id !== p.id) {
    box.innerHTML = `<div class="loc-info">
        <div class="loc-head"><span class="av" id="lc-av"></span><h2>${esc(p.name)}</h2><button class="x" data-act="close-locate" aria-label="Close route">${ICON.close}</button></div>
        <div class="dir"><div class="arrow-wrap" id="lc-aw"><svg class="arrow" id="lc-arrow" viewBox="0 0 70 70" aria-hidden="true"><path id="lc-ap" d="${ARROW}" fill="currentColor"/></svg></div>
          <div><div class="big" id="lc-big"></div><div class="then" id="lc-then"></div></div></div>
        <div class="where" id="lc-where"></div>
        <div id="lc-act" style="margin-top:auto"></div>
      </div><div class="loc-view" id="lc-view"></div>`;
    const el = $("lc-view");
    locDom = { mode, id: p.id, scene: mode === "in" ? buildScene(el, p) : buildFlat(el) };
  }
  paint($("lc-av"), p.level); $("lc-av").textContent = p.ini;
  const r = route(p, m);
  $("lc-aw").hidden = !!r.plain;
  $("lc-big").textContent = r.big;
  $("lc-then").textContent = r.then;
  const svg = $("lc-arrow"), path = $("lc-ap");
  if (r.here) {
    svg.classList.add("here"); path.setAttribute("d", CHECK); path.setAttribute("fill", "none"); path.setAttribute("stroke", "currentColor"); path.setAttribute("stroke-width", "8"); svg.style.transform = "none";
  } else if (r.dx !== undefined) {
    svg.classList.remove("here"); path.setAttribute("d", ARROW); path.setAttribute("fill", "currentColor"); path.removeAttribute("stroke");
    const a = mode === "in" ? screenAngle(r.dx, r.dy) : (Math.atan2(r.dx, r.dy) * 180) / Math.PI;
    lastAngle += ((((a - lastAngle) % 360) + 540) % 360) - 180;
    svg.style.transform = `rotate(${lastAngle}deg)`;
  }
  setHtml($("lc-where"), `${ICON.pin}${esc(p.place)}`);
  setHtml($("lc-act"), p.sev >= 2
    ? (p.acked_by ? `<button class="btn green" disabled>${iconSvg(ICON.check, 'class="i"')}On my way</button>` : `<button class="btn dark" data-act="ack">On my way</button>`)
    : "");
  if (mode === "in") updateScene(p, m); else updateFlat(p, m);
}

function screenAngle(dx, dy) {
  const a = (TURN_Z * Math.PI) / 180, vx = dx, vy = -dy;
  const x1 = vx * Math.cos(a) - vy * Math.sin(a), y1 = (vx * Math.sin(a) + vy * Math.cos(a)) * Math.cos((TILT_X * Math.PI) / 180);
  return (Math.atan2(x1, -y1) * 180) / Math.PI;
}
function buildScene(el, p) {
  const W = BUILDING.width_m, D = BUILDING.depth_m, floors = BUILDING.floors;
  const cw = el.clientWidth, ch = el.clientHeight;
  const ppm = Math.min((cw * 0.62) / W, (ch * 0.9) / D), fw = W * ppm, fd = D * ppm;
  const gap = Math.max(32, Math.min(ch * 0.12, 70));
  const topPct = 50 + Math.min(16, (((floors.length - 1) * gap * 0.82) / ch) * 50);
  const scene = document.createElement("div"); scene.className = "scene flat"; scene.style.top = `${topPct}%`;
  const ground = document.createElement("div"); ground.className = "ground";
  ground.style.cssText = `width:${(WORLD.x1 - WORLD.x0) * ppm}px;height:${(WORLD.y1 - WORLD.y0) * ppm}px;left:${(WORLD.x0 - 45) * ppm}px;top:${(25 - WORLD.y1) * ppm}px`;
  ground.innerHTML = `<img alt="" src="${MAP_URL}">`;
  scene.appendChild(ground);
  const fl = {}, level = {};
  floors.forEach((n, i) => {
    const f = document.createElement("div"); f.className = "floor";
    f.style.cssText = `width:${fw}px;height:${fd}px;left:${-fw / 2}px;top:${-fd / 2}px;transform:translateZ(${i * gap}px)`;
    scene.appendChild(f); fl[n] = f; level[n] = i;
  });
  el.innerHTML = ""; el.appendChild(scene);
  const overlay = document.createElement("div"); overlay.className = "overlay"; el.appendChild(overlay);
  requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.remove("flat")));
  setTimeout(() => overlay.classList.add("shown"), matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 950);
  const s = { el, fl, level, W, D, fw, fd, gap, cw, ch, topPct, sy: (ch * topPct) / 100, overlay, nums: {} };
  for (const n of floors) { const lab = document.createElement("div"); lab.className = "floor-num"; lab.textContent = n; overlay.appendChild(lab); s.nums[n] = lab; }
  placeNums(s);
  s.you = makeMarker(s.overlay, "You", "you"); s.pin = makeMarker(s.overlay, p.ini, "");
  return s;
}
function placeNums(s) { for (const [n, lab] of Object.entries(s.nums)) { const pt = project(s, 0, 0, +n); lab.style.left = `${pt.left}px`; lab.style.top = `${pt.top}px`; } }
function project(s, x, y, floor) {
  const px = -s.fw / 2 + (x / s.W) * s.fw, py = -s.fd / 2 + (1 - y / s.D) * s.fd, pz = floor == null ? 0 : (s.level[floor] || 0) * s.gap;
  const a = (TURN_Z * Math.PI) / 180, b = (TILT_X * Math.PI) / 180, P = 1200;
  const x1 = px * Math.cos(a) - py * Math.sin(a), y1 = px * Math.sin(a) + py * Math.cos(a);
  const y2 = y1 * Math.cos(b) - pz * Math.sin(b), z2 = y1 * Math.sin(b) + pz * Math.cos(b), k = P / (P - z2);
  return { left: s.cw / 2 + x1 * k, top: s.ch / 2 + (s.sy + y2 - s.ch / 2) * k };
}
function makeMarker(parent, label, cls) {
  const ring = document.createElement("div"); ring.className = "ring " + cls;
  const head = document.createElement("div"); head.className = "marker " + cls;
  head.innerHTML = `<div class="head">${esc(label)}</div><div class="stem"></div>`;
  parent.appendChild(head);
  return { ring, head };
}
function putMarker(s, mk, who, color, ink) {
  if (who.x === null) { mk.ring.remove(); mk.head.hidden = true; return; }
  const f = who.outdoor ? null : s.fl[who.floor];
  if (f) {
    if (mk.ring.parentNode !== f) f.appendChild(mk.ring);
    mk.ring.style.left = `${(who.x / s.W) * 100}%`; mk.ring.style.top = `${(1 - who.y / s.D) * 100}%`; mk.ring.style.setProperty("--c", color);
  } else mk.ring.remove();
  const pt = project(s, who.x, who.y, who.outdoor ? null : who.floor);
  mk.head.hidden = false; mk.head.style.left = `${pt.left}px`; mk.head.style.top = `${pt.top}px`;
  mk.head.style.setProperty("--c", color); if (ink) mk.head.style.setProperty("--c-ink", ink);
}
function updateScene(p, m) {
  const s = locDom.scene, L = LOOK[p.level];
  if (s.el.clientWidth !== s.cw || s.el.clientHeight !== s.ch) { s.cw = s.el.clientWidth; s.ch = s.el.clientHeight; s.sy = (s.ch * s.topPct) / 100; placeNums(s); }
  for (const [n, f] of Object.entries(s.fl)) {
    f.classList.toggle("on", +n === p.floor); f.classList.toggle("mine", !!(m && !m.outdoor && +n === m.floor));
    f.style.setProperty("--c", L.fill);
    s.nums[n].classList.toggle("on", +n === p.floor); s.nums[n].style.setProperty("--c", L.fill); s.nums[n].style.setProperty("--c-ink", L.ink);
  }
  if (m) putMarker(s, s.you, m, "var(--ink)"); else { s.you.ring.remove(); s.you.head.hidden = true; }
  putMarker(s, s.pin, p, L.fill, L.ink);
}
function buildFlat(el) {
  el.classList.add("flatmap");
  el.innerHTML = `<img alt="" id="fm-img" src="${MAP_URL}"><svg class="route" aria-hidden="true"><line id="fm-line" stroke="var(--you)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/></svg>`;
  const s = { el, ppm: null };
  s.you = makeMarker(el, "You", "you"); s.pin = makeMarker(el, "", "");
  return s;
}
function updateFlat(p, m) {
  const s = locDom.scene, el = s.el, cw = el.clientWidth, ch = el.clientHeight;
  const pts = [p, m].filter((q) => q && q.x !== null);
  if (!pts.length) return;
  const cx = pts.reduce((a, q) => a + q.x, 0) / pts.length, cy = pts.reduce((a, q) => a + q.y, 0) / pts.length;
  const spanX = Math.max(...pts.map((q) => Math.abs(q.x - cx))) * 2 + 60, spanY = Math.max(...pts.map((q) => Math.abs(q.y - cy))) * 2 + 60;
  const want = clamp(Math.min(cw / spanX, ch / spanY), 1.2, 5);
  if (!s.ppm || want < s.ppm * 0.8 || want > s.ppm * 1.4) s.ppm = want;
  const k = s.ppm, sx = (x) => cw / 2 + (x - cx) * k, sy = (y) => ch / 2 - (y - cy) * k;
  const img = $("fm-img");
  img.style.width = `${(WORLD.x1 - WORLD.x0) * k}px`; img.style.height = `${(WORLD.y1 - WORLD.y0) * k}px`;
  img.style.left = `${sx(WORLD.x0)}px`; img.style.top = `${sy(WORLD.y1)}px`;
  const place = (mk, q, color, ink) => {
    if (!q || q.x === null) { mk.head.hidden = true; return; }
    mk.head.hidden = false; mk.head.style.left = `${sx(q.x)}px`; mk.head.style.top = `${sy(q.y)}px`;
    mk.head.style.setProperty("--c", color); if (ink) mk.head.style.setProperty("--c-ink", ink);
  };
  const L = LOOK[p.level];
  s.pin.head.querySelector(".head").textContent = p.ini;
  place(s.pin, p, L.fill, L.ink); place(s.you, m, "var(--ink)");
  const line = $("fm-line");
  if (m && m.x !== null) { line.setAttribute("x1", sx(m.x)); line.setAttribute("y1", sy(m.y)); line.setAttribute("x2", sx(p.x)); line.setAttribute("y2", sy(p.y)); }
}

/* ================= run ================= */
const hub = new Hub(), sim = new Sim(hub);
let simT = 1e6, timer = null;
function renderAll() { renderRail(); renderPins(); renderBanner(); renderPop(); if (locating) renderLocate(); }
function tick() { simT += 1; sim.step(simT); state = hub.snapshot(simT); renderAll(); }
function setSpeed(n) {
  document.documentElement.style.setProperty("--move", `${Math.max(0.05, 0.8 / n)}s`);
  document.querySelectorAll("[data-speed]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.speed === n)));
  clearInterval(timer); timer = setInterval(tick, 1000 / n);
}
function select(id) {
  if (locating) closeLocate();
  sel = sel === id ? "" : id;
  if (sel) focusOn(person(sel));
  if (sel && matchMedia("(max-width: 760px)").matches) document.querySelector(".main").scrollTo({ top: 0, behavior: "smooth" });   // the map sits above the list on phones
  renderAll();
}

document.addEventListener("click", (e) => {
  const sp = e.target.closest("[data-speed]"); if (sp) return setSpeed(+sp.dataset.speed);
  const demo = e.target.closest("[data-demo]");
  if (demo) { const top = workers().find((w) => w.level === "danger"); sim.action(demo.dataset.demo, sel || (top && top.id)); return; }
  if (e.target.closest("#demo-btn")) { const p = $("demo-pop"); p.hidden = !p.hidden; $("demo-btn").setAttribute("aria-expanded", String(!p.hidden)); return; }
  if (!e.target.closest("#demo-pop")) { $("demo-pop").hidden = true; $("demo-btn").setAttribute("aria-expanded", "false"); }
  const s = e.target.closest("[data-sel]");
  if (s) { if (s.id === "bn-show") { sel = ""; } return select(s.dataset.sel); }
  const al = e.target.closest("[data-alert]");
  if (al) { const b = hub.badges.get(al.dataset.alert); if (b) b.alertSent = b.alertSent > simT - 60 ? -1e9 : simT; state = hub.snapshot(simT); return renderAll(); }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "rail") { railHidden = !railHidden; renderRail(); }
  else if (act === "locate") openLocate();
  else if (act === "close-locate") closeLocate();
  else if (act === "close-pop") { sel = ""; renderAll(); }
  else if (act === "ack") { const b = hub.badges.get(sel); if (b) b.ackedBy = "You"; state = hub.snapshot(simT); renderAll(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("demo-pop").hidden) $("demo-pop").hidden = true; else if (locating) closeLocate(); else if (sel) { sel = ""; renderAll(); }
});
$("z-in").onclick = () => zoomBy(1.35);
$("z-out").onclick = () => zoomBy(1 / 1.35);
$("z-fit").onclick = () => { sel = ""; fitAll(); renderAll(); };
const mapv = $("mapv");
mapv.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button, [data-nodrag]")) return;
  drag = { px: e.clientX, py: e.clientY, cx: cam.cx, cy: cam.cy };
  try { mapv.setPointerCapture(e.pointerId); } catch (err) { /* fine without capture */ }
  mapv.classList.add("drag");
});
mapv.addEventListener("pointermove", (e) => {
  if (!drag) return;
  cam.cx = clamp(drag.cx - (e.clientX - drag.px) / cam.k, 0, WX(WORLD.x1));
  cam.cy = clamp(drag.cy - (e.clientY - drag.py) / cam.k, 0, WY(WORLD.y0));
  camTransform();
});
const endDrag = () => { if (!drag) return; drag = null; mapv.classList.remove("drag"); };
mapv.addEventListener("pointerup", endDrag); mapv.addEventListener("pointercancel", endDrag); mapv.addEventListener("pointerleave", endDrag);
mapv.addEventListener("wheel", (e) => { if (e.target.closest("[data-nodrag]")) return; e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12); }, { passive: false });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (locating) locDom = null; renderAll(); }, 200); });

(function start() {
  if (matchMedia("(max-width: 760px)").matches) railHidden = false;
  sim.boot(simT);
  state = hub.snapshot(simT);
  renderAll();
  fitAll();
  setSpeed(1);
})();
</script>
